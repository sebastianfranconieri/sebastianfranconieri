    <style>
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        /* Fondo negro total y reset */
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        /* Título pequeño arriba a la izquierda */
        .brand-title {
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0px;
            margin-left: 30px;
            color: #ffffff;
            opacity: 0.8;
        }

        /* Configuración de la cuadrícula: 4 columnas */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 15px; /* Espacio entre videos */
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            margin-bottom: 80px;
        }

        /* Contenedor vertical (proporción 9:16) */
        .video-item {
            position: relative;
            width: 100%;
            padding-top: 177.77%; /* Relación de aspecto para Reels/TikTok */
            background-color: #0a0a0a;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Estilo del iframe para que ocupe todo el contenedor */
        .video-item iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

    .contact-footer-wrapper {
    /* position: absolute;  <-- ELIMINA ESTO */
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px; /* Espaciado interno */
    margin-top: 50px; /* Espacio respecto a los videos */
    width: 100%;
    box-sizing: border-box; /* Para que el padding no rompa el ancho */
}

        /* lado izquierdo */
        .footer-left {
            display: flex;
            flex-direction: column; /* 👈 esto es la clave */
            align-items: flex-start;
            gap: 6px;
            font-family: 'Monument', sans-serif;
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 3px;
        }

        .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        width: 100%;
        }

        .nav-link {
        color: #ffffff;
        text-decoration: none;
        font-family: 'Monument', sans-serif;
        font-size: 14px;
        margin-right: 30px;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
        transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 1;
        }

        .cinematic-contact {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #ffffff !important; 
            font-family: 'Monument', sans-serif;
            font-size: clamp(10px, 1vw, 12px);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding-bottom: 16px; /* Ajustado para que la línea esté cerca del texto */
            position: relative;
            margin-right: 20px;
            transition: transform 0.4s ease;
            white-space: nowrap;
        }

        .contact-separator {
        margin: 0 10px;
        }

        .cinematic-contact::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;      
            width: 0%;    
            height: 1px;
            background-color: #ffffff;
            transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .cinematic-contact:hover::after {
            width: 100%;
        }

        @font-face { 
        font-family: 'Monument'; 
        src: url('/fonts/monument.woff2') format('woff2'),
            url('/fonts/monument.otf') format('opentype'); 
        font-display: swap; /* Changed from 'block' to 'swap' for better loading */
        }

        .footer-left, .cinematic-contact, .brand-title, .nav-link { font-family: 'Monument', sans-serif !important;  font-size: 1em ; text-transform: uppercase; letter-spacing: 0.2em;}
   
        @media (max-width: 768px) {
          body { padding: 10px; }
            
            .video-grid {
                grid-template-columns: repeat(5, 1fr); /* SE MANTIENEN LAS 5 */
                gap: 5px; /* Reducimos espacio para que quepan mejor */
                padding: 10px;
            }

            .brand-title { margin-left: 15px; font-size: 10px; }
            .nav-link { margin-right: 15px; font-size: 10px; }

            .contact-footer-wrapper {
                flex-direction: column; /* Apilar para evitar superposición */
                gap: 20px;
                text-align: center;
                align-items: center;
            }

            .footer-left { align-items: center; font-size: 9px; }
            .cinematic-contact {margin-left: 15px; ; font-size: 9px; }
        }

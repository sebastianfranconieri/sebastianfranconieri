<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastian Franconieri | Filmmaker | Producer</title>
  <link rel="icon" type="image/png" href="images/logosf.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header will be loaded by JavaScript -->
  <div id="header-container"></div>

  <main class="about-main container-fluid px-0">
    <img src="../images/banner2.jpg" alt="Banner principal" class="hero-img w-100" />

  <div class="container py-4">
      <h2 class="footer-line1 mi-texto text-center mb-4">Contact</h2>
      <p class="text-center mx-md-5">For inquiries about collaborations or bookings, please get in touch directly.</p>
      <div class="text-center">
        <a class="footer-line3" href="mailto:hi@sebastianfranconieri.com">hi@sebastianfranconieri.com</a>
      </div>
    </div>
    </main>

  <!-- Footer will be loaded by JavaScript -->
  <div id="footer-container"></div>

  <!-- Bootstrap 4 JS and dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"></script>
  
  <!-- Load shared header and footer -->
  <script>
    // Load header
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
      });
    
    // Load footer
    fetch('footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-container').innerHTML = data;
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Sebastian Franconieri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="contact-page">
  <!-- Header will be loaded by JavaScript -->
  <div id="header-container"></div>
  
  
  <main class="pt-1 pb-5">

<section class="hero-container pb-4">
  <div class="background-image"></div>

    <div class="contact-section contact-container pt-5">

    <!-- LEFT INFO -->
    <div class=" left-contact contact-info justify-content-center">
      <h2 class="footer-line1 mi-texto mb-4">Contact</h2>

      <p>
         <a class="footer-line3" href="mailto:hi@sebastianfranconieri.com">hi@sebastianfranconieri.com</a>
      </p>

      <p>
        <a class="mi-texto negrita" href="https://wa.me/33750570423" target="_blank">
          +33 7 50 57 04 23
        </a>
      </p>
    </div>

    <!-- RIGHT FORM -->
    <form
      class="contact-form"
      action="https://formspree.io/f/YOUR_FORMSPREE_ID"
      method="POST"
    >

      <input
        type="text"
        name="name"
        placeholder="Name"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Email"
        required
      >

      <input
        type="tel"
        name="phone"
        placeholder="Phone (optional)"
      >

      <textarea
        name="message"
        placeholder="Message"
        required
      ></textarea>

      <!-- Mensaje de respuesta de Formspree -->
      <input type="hidden" name="_subject" value="New contact from website">

      <!-- Página de thank you (opcional más adelante) -->
      <!-- <input type="hidden" name="_redirect" value="thank-you.html"> -->

      <button type="submit">Send</button>

      </form>
      </div>
    </section>
  </main>
  
  <!-- Footer will be loaded by JavaScript -->
  <div id="footer-container"></div>

  <!-- Bootstrap 4 JS and dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"></script>
  
  <!-- Load shared header and footer -->
  <script>
    // Load header
    fetch('/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
      });
    
    // Load footer
    fetch('/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-container').innerHTML = data;
      });
  </script>
 
 <script>
  // FADE OUT + SCROLL SMOOTH
  document.addEventListener('click', function (e) {
    const link = e.target.closest('a');
    if (!link) return;

    const href = link.getAttribute('href');
    if (!href) return;

    // ignorar mail, target="_blank" y externos
    if (
      href.startsWith('mailto:') ||
      link.target === '_blank' ||
      href.startsWith('http')
    ) return;

    // scroll smooth al video
    if (href === '/#video' || href === '#video') {
      const section = document.querySelector('#video');
      if (section) {
        e.preventDefault();
        section.scrollIntoView({ behavior: 'smooth' });
      }
      return;
    }

    // hash en la misma página
    if (href.startsWith('#')) return;

    // fade out + navegación
    e.preventDefault();
    document.body.classList.add('fade-out');

    setTimeout(() => {
      window.location.href = href;
    }, 600);
  });
</script>

<script>
  // FADE IN BANNERS Selecciona todos los videos con clase .hero-video
  document.addEventListener('DOMContentLoaded', () => {
    const videos = document.querySelectorAll('.hero-video');

    videos.forEach(video => {
      // Inicialmente invisible
      video.style.opacity = 0;
      video.style.transition = 'opacity 1.2s cubic-bezier(0.83, 0, 0.17, 1)';

      // Espera a que el video pueda reproducirse
      video.addEventListener('canplay', function fadeIn() {
        video.removeEventListener('canplay', fadeIn);
        // Fade-in solo la primera vez
        requestAnimationFrame(() => {
          video.style.opacity = 1;
        });
      });
    });
  });
</script>
 
</body>
</html>
